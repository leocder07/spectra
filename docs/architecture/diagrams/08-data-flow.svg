-file random-nonce fences</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.4731" x="2071.872" y="501.7588">- explicit data-vs-instruction system block</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="67" id="ent0031"><path d="M657.1354,570.5083 L657.1354,657.061 A0,0 0 0 0 657.1354,657.061 L985.8571,657.061 A0,0 0 0 0 985.8571,657.061 L985.8571,580.5083 L975.8571,570.5083 L825.4954,570.5083 L821.4954,505.8483 L817.4954,570.5083 L657.1354,570.5083 A0,0 0 0 0 657.1354,570.5083" fill="#E5E7EB" style="stroke:#181818;stroke-width:0.5;"/><path d="M975.8571,570.5083 L975.8571,580.5083 L985.8571,580.5083 L975.8571,570.5083" fill="#E5E7EB" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.855" x="663.1354" y="588.0766">Privacy boundary (ADR-018 &#167;4):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.7871" x="671.362" y="603.3872">LOG repo_signature, finding_signature,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.1938" x="687.8151" y="618.6977">actor, cost_usd, tokens_*, MAC fingerprint.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.4951" x="671.362" y="634.0083">NEVER LOG repo URL, file paths, code excerpts,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.6133" x="687.8151" y="649.3188">finding text, secret material.</text></g><!--link dev to cli--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" data-link-type="dependency" data-source-line="39" id="lnk13"><path d="M1131.4954,119.8983 C1131.4954,164.9083 1131.4954,232.7783 1131.4954,269.8083" fill="none" id="dev-to-cli" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1131.4954,275.