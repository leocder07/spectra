<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="651px" preserveAspectRatio="none" style="width:1171px;height:651px;background:#FFFFFF;" version="1.1" viewBox="0 0 1171 651" width="1171px" zoomAndPan="magnify"><title>Cache key composition (Object diagram &#8212; frozen at run start)</title><defs/><g><g class="title" data-source-line="8"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="448.752" x="354.3052" y="23.5352">Cache key composition (Object diagram &#8212; frozen at run start)</text></g><g class="entity" data-qualified-name="bind" data-source-line="18" id="ent0002"><rect fill="#7C3AED" height="94.4414" rx="2.5" ry="2.5" style="stroke:#4C1D95;stroke-width:0.5;" width="679.4678" x="141.53" y="44.4883"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8867" x="417.3205" y="60.0234">bind_run_context()</text><line style="stroke:#4C1D95;stroke-width:0.5;" x1="142.53" x2="819.9978" y1="64.9766" y2="64.9766"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264.5098" x="147.53" y="82.5117">model_versions   = "claude-opus-4-7"</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="667.4678" x="147.53" y="99">prompt_versions  = blake2b(_SHARED_GUIDANCE | role+system_prompt x6 | _CRITIQUE_PROMPT)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.249" x="147.53" y="115.4883">schema_version   = "v1"</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.1553" x="147.53" y="131.9766">spectra_version  = "0.5.0"</text></g><g class="entity" data-qualified-name="r" data-source-line="25" id="ent0003"><rect fill="#7C3AED" height="61.4648" rx="2.5" ry="2.5" style="stroke:#4C1D95;stroke-width:0.5;" width="274.5205" x="7" y="240.6683"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.3066" x="61.6069" y="256.2034">RepoCacheKey (Phase 2)</text><line style="stroke:#4C1D95;stroke-width:0.5;" x1="8" x2="280.5205" y1="261.1566" y2="261.1566"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.5205" x="27" y="278.6917">repo_signature   = blake2b(file_tree)</text><g data-visibility-modifier="PUBLIC_FIELD"><ellipse cx="18" cy="291.389" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.7227" x="27" y="295.18">4-tuple from bind_run_context</text></g><g class="entity" data-qualified-name="b" data-source-line="30" id="ent0004"><rect fill="#7C3AED" height="77.9531" rx="2.5" ry="2.5" style="stroke:#4C1D95;stroke-width:0.5;" width="329.9053" x="316.31" y="232.4183"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.123" x="397.2011" y="247.9534">BatchCacheKey (Phase 3)</text><line style="stroke:#4C1D95;stroke-width:0.5;" x1="317.31" x2="645.2153" y1="252.9066" y2="252.9066"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="303.9053" x="336.31" y="270.4417">batch_id         = blake2b(sorted(file_hashes))</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.4658" x="336.31" y="286.93">dimension        = "security"</text><g data-visibility-modifier="PUBLIC_FIELD"><ellipse cx="327.31" cy="299.6273" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.7227" x="336.31" y="303.4183">4-tuple from bind_run_context</text></g><g class="entity" data-qualified-name="f" data-source-line="36" id="ent0005"><rect fill="#7C3AED" height="110.9297" rx="2.5" ry="2.5" style="stroke:#4C1D95;stroke-width:0.5;" width="260.8555" x="680.83" y="215.9283"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.0518" x="703.7319" y="231.4634">(file_hash, dimension) (Phase 1)</text><line style="stroke:#4C1D95;stroke-width:0.5;" x1="681.83" x2="940.6855" y1="236.4166" y2="236.4166"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.9639" x="686.83" y="253.9517">file_hash        = blake2b(file_bytes)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.3701" x="686.83" y="270.44">dimension        = "architecture"</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.4512" x="686.83" y="286.9283">model_version    = bound</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.8555" x="686.83" y="303.4166">prompt_version   = bound (per-dim)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.291" x="686.83" y="319.9048">schema_version   = bound</text></g><g class="entity" data-qualified-name="mac" data-source-line="48" id="ent0009"><rect fill="#7C3AED" height="77.9531" rx="2.5" ry="2.5" style="stroke:#4C1D95;stroke-width:0.5;" width="289.3271" x="336.6" y="418.8583"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.5078" x="397.5097" y="434.3934">Per-row MAC (ADR-012)</text><line style="stroke:#4C1D95;stroke-width:0.5;" x1="337.6" x2="624.9271" y1="439.3466" y2="439.3466"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.1025" x="342.6" y="456.8817">blake2b(key=secret, digest_size=32)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277.3271" x="342.6" y="473.37">.update(part || NUL) for part in key_parts</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.3008" x="342.6" y="489.8583">.update(serialized_value)</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="59" id="ent0014"><path d="M318.44,557.8183 L318.44,644.371 A0,0 0 0 0 318.44,644.371 L644.0767,644.371 A0,0 0 0 0 644.0767,644.371 L644.0767,567.8183 L634.0767,557.8183 L485.26,557.8183 L481.26,497.0683 L477.26,557.8183 L318.44,557.8183 A0,0 0 0 0 318.44,557.8183" fill="#FEF3C7" style="stroke:#181818;stroke-width:0.5;"/><path d="M634.0767,557.8183 L634.0767,567.8183 L644.0767,567.8183 L634.0767,557.8183" fill="#FEF3C7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.1665" x="324.44" y="575.3866">CacheSecret(value=32 bytes) is per-`$UID`,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.6367" x="324.44" y="590.6972">loaded from OS keyring at adapter construction.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4004" x="324.44" y="606.0077">Bumping ANY key component or the secret</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.3882" x="324.44" y="621.3183">produces a different MAC &#8212; compare_digest</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.5859" x="324.44" y="636.6288">rejects the row at lookup.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="67" id="ent0017"><path d="M856.15,63.7483 L856.15,87.7083 L821.44,91.7083 L856.15,95.7083 L856.15,119.6799 A0,0 0 0 0 856.15,119.6799 L1164.3624,119.6799 A0,0 0 0 0 1164.3624,119.6799 L1164.3624,73.7483 L1154.3624,63.7483 L856.15,63.7483 A0,0 0 0 0 856.15,63.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1154.3624,63.7483 L1154.3624,73.7483 L1164.3624,73.7483 L1154.3624,63.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.5366" x="862.15" y="81.3166">Atomic four-tuple binding eliminates the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.2124" x="862.15" y="96.6272">half-bound state of the Phase 1 set_* setters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.6792" x="862.15" y="111.9377">Composition root calls this once at startup.</text></g><!--link bind to r--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="44" id="lnk6"><path codeLine="44" d="M392.72,139.3983 C332.26,171.2683 259.2372,209.7693 206.8472,237.3993" fill="none" id="bind-to-r" style="stroke:#7C3AED;stroke-width:1;"/><polygon fill="#7C3AED" points="201.54,240.1983,211.3667,239.538,205.9626,237.8658,207.6348,232.4618,201.54,240.1983" style="stroke:#7C3AED;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.4448" x="333.94" y="182.4966">composes</text></g><!--link bind to b--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="45" id="lnk7"><path codeLine="45" d="M481.26,139.3983 C481.26,168.2883 481.26,198.9283 481.26,226.1083" fill="none" id="bind-to-b" style="stroke:#7C3AED;stroke-width:1;"/><polygon fill="#7C3AED" points="481.26,232.1083,485.26,223.1083,481.26,227.1083,477.26,223.1083,481.26,232.1083" style="stroke:#7C3AED;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.4448" x="482.26" y="182.4966">composes</text></g><!--link bind