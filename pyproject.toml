[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-ai"
version = "0.9.1"
description = "8 AI agents analyze your entire repository in under 5 minutes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Vivek Kumar", email = "vivek@proxie.in"},
]
keywords = ["code-analysis", "ai-agents", "code-review", "clean-architecture", "claude", "anthropic", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Runtime dependencies — required for spectra to function
# Upper bounds are intentional (Q1 #9): a transitive minor bump cannot
# silently land in a regulated SDLC. Bounds are conservative — wide
# enough that we don't pin people to today's exact versions, narrow
# enough that the next major (which can break us) requires an
# explicit Renovate PR + maintainer review.
dependencies = [
    # anthropic ships fast-moving 0.x minors — <1.0 keeps us inside the
    # current pre-1.0 stream so a future v1.0 (which can break us) needs
    # an explicit PR rather than a transitive lockfile bump.
    "anthropic>=0.40,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13,<15",
    "pydantic>=2.5,<3.0",
    "gitpython>=3.1.30,<4.0",
    "tiktoken>=0.7,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    # ADR-012: per-user cache HMAC secret stored in OS keyring
    "keyring>=24,<26",
    # #6 pre-flight: gitignore + .spectraignore semantics
    "pathspec>=0.12,<1.0",
    # #57 + ADR-018 + #18: Ed25519 signed scan receipts + waiver signature
    # verification. Bound at <45 — v45 is gated on a verified rebuild +
    # full receipt regression sweep before we widen.
    "cryptography>=43,<45",
    # #17 + #18 + ADR-020: YAML config / policy / waivers / approvers
    "pyyaml>=6,<7",
    # #25 + ADR-022: Postgres history-store driver + connection pool.
    # Optional in practice — composition root only imports psycopg lazily
    # when ``--history-backend postgres`` is requested. The default sqlite
    # backend ships with the stdlib and runs without psycopg installed.
    "psycopg[pool]>=3.1,<4.0",
    # #21 + ADR-021: distributed L2 cache via Redis (opt-in via --cache-remote).
    # redis-py merged the legacy aioredis package as ``redis.asyncio`` in 5.0.
    # Bound at <6 so the next major (which can break us) requires an explicit
    # PR rather than a transitive lockfile bump.
    "redis>=5.0,<6.0",
    # #30 + #33 + ADR-023: OpenTelemetry tracing + per-agent cost attribution.
    # The OTel SDK + OTLP/HTTP exporter are wired at the composition root
    # only when --otel-endpoint is set; the default tracer is the in-process
    # NoopTracerAdapter (zero overhead). Bounds match the OTel Python LTS
    # stream — <2.0 keeps a future major behind an explicit Renovate PR.
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[project.optional-dependencies]
# Roadmap #13: SQLCipher at-rest cache encryption — optional extra.
# pysqlcipher3 source-builds against ``libsqlcipher`` and has no macOS
# wheel (and a scarce Windows one). Listing it as a runtime dep made
# ``pip install spectra-ai`` fail on a clean macOS without ``brew install
# sqlcipher``. The cache adapter already degrades to plain SQLite + HMAC
# when the import fails (one WARN per process, see ``cache_adapter.py``)
# so making it opt-in costs nothing at runtime — operators who want
# at-rest encryption install with ``pip install "spectra-ai[encryption]"``.
encryption = [
    "pysqlcipher3>=1.2,<2.0",
]

# Development-only dependencies — NOT included in production installs
# Install with: pip install -e ".[dev]"
# Note: ``pyyaml`` is a runtime dep (see ``[project].dependencies``) and is
# inherited transitively by the dev install, so we do not list it twice.
dev = [
    "pytest>=8,<10",
    # pytest-asyncio is still on 0.x; <1.0 keeps us inside the current
    # major series so a future v1.0 (which can break us) needs an explicit
    # PR rather than a transitive lockfile bump.
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2.2,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "build>=1.2,<2.0",
    # #21 + ADR-021: in-process Redis fake for the L2 cache test suite.
    # Lets us exercise RedisCacheAdapter end-to-end without Docker so CI
    # stays hermetic. Live-Redis verification is gated by the
    # ``SPECTRA_CACHE_REDIS`` env var (see test_redis_cache_integration.py).
    "fakeredis>=2,<3",
]

[project.scripts]
spectra = "spectra.infrastructure.main:cli"

[project.urls]
Homepage = "https://github.com/leocder07/spectra"
Repository = "https://github.com/leocder07/spectra"
Issues = "https://github.com/leocder07/spectra/issues"
Changelog = "https://github.com/leocder07/spectra/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship Jinja2 HTML report template inside the wheel so end users
# (who pip install spectra-ai) get a working report renderer.
spectra = ["templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "PLW",  # pylint warnings
    "PLR",  # pylint refactor
    "PERF", # perflint — performance anti-patterns
    "RUF",  # ruff-specific rules
    "T20",  # flake8-print — no print() in src/
    "DTZ",  # flake8-datetimez — timezone-aware datetimes
    "PIE",  # flake8-pie — misc lints
    "RSE",  # flake8-raise — clean raise patterns
    "TCH",  # flake8-type-checking — TYPE_CHECKING optimization
    "TID",  # flake8-tidy-imports — import hygiene
]
ignore = [
    "TCH001",  # typing-only-first-party-import — conflicts with Pydantic runtime needs
    "TCH002",  # typing-only-third-party-import — same issue
    "PLR0913", # too-many-arguments — agent constructors need multiple params
    "PLR2004", # magic-value-comparison — score thresholds are self-documenting
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "PT011", "T20", "TC003", "PERF401"]  # Allow assert, skip annotations, magic values, broad raises, print, type-check imports, list-comp perf
"src/spectra/infrastructure/agents/specialist_prompts.py" = ["E501"]  # Long prompt strings
"src/spectra/infrastructure/agents/critique_agent.py" = ["E501"]  # Long prompt strings
"src/spectra/infrastructure/agents/meta_prompter.py" = ["E501"]  # Long prompt strings
"src/spectra/adapters/cli_controller.py" = ["T20"]  # CLI uses Rich console.print, not stdlib print

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["git.*", "tiktoken.*", "yaml.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
# Force tests to import from the worktree's own src/ instead of whatever
# editable install happens to be active in site-packages (which can point to
# a sibling worktree). Critical for security/regression tests.
pythonpath = ["src"]
markers = [
    "unit: Pure unit tests with no I/O or external dependencies",
    "integration: Tests requiring infrastructure adapters or file I/O",
    "slow: Tests that take >5 seconds (e.g. large repo analysis)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:tiktoken.*",
]

[tool.coverage.run]
source = ["spectra"]
omit = [
    "tests/*",
    "src/spectra/infrastructure/agents/specialist_prompts.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "pass",
]
