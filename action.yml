# Spectra — GitHub composite Action
#
# Reference this from any repo as:
#   uses: leocder07/spectra@v1
#
# What it does:
#   1. Installs `spectra-ai` from PyPI on the runner's Python.
#   2. Runs `spectra analyze` against the target repo.
#   3. Optionally posts (or updates) a PR comment with the grade
#      and top critical findings, idempotent across re-runs.
#   4. Optionally uploads SARIF to the GitHub code-scanning / Security
#      tab when `format: sarif` (needs `security-events: write`).
#
# Caller must grant: `contents: read`, (if comment-on-pr) `pull-requests:
# write`, and (if format is sarif) `security-events: write`.

name: Spectra
description: 8 AI agents grade your repository across 6 dimensions — architecture, security, quality, docs, maintainability, performance.
author: leocder07
branding:
  icon: layers
  color: purple

inputs:
  anthropic-api-key:
    description: Anthropic API key. Pass via `${{ secrets.ANTHROPIC_API_KEY }}`.
    required: true
  path:
    description: Path or https URL to analyze. Defaults to the checked-out workspace (`.`).
    required: false
    default: "."
  format:
    description: Output format — `json` (recommended for CI), `html`, or `sarif` (uploads to the Security tab).
    required: false
    default: "json"
  quick-mode:
    description: When `true`, skip the CritiqueAgent stage for faster results (~60s vs ~3min).
    required: false
    default: "false"
  comment-on-pr:
    description: When `true` and the workflow runs on a `pull_request` event, post or update a PR comment with the findings.
    required: false
    default: "true"
  python-version:
    description: Python version to install on the runner.
    required: false
    default: "3.12"
  spectra-version:
    description: Specific `spectra-ai` version to install. Defaults to latest.
    required: false
    default: ""
  fail-on:
    description: Severity gate — exit 1 when any finding is at or above this severity. One of `critical`, `high`, `medium`, `low`, `none`.
    required: false
    default: "critical"
  min-score:
    description: Quality gate — exit 1 when the overall weighted score (0-100) is below this floor. `0` disables the gate.
    required: false
    default: "0"

outputs:
  grade:
    description: Overall grade (e.g. `A-`, `B+`).
    value: ${{ steps.parse.outputs.grade }}
  score:
    description: Overall numeric score from 0 to 100.
    value: ${{ steps.parse.outputs.score }}
  findings-json:
    description: Path on the runner to the raw JSON report.
    value: ${{ steps.run.outputs.report_path }}

runs:
  using: composite
  steps:
    # Pinned to v5.3.0
    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install spectra-ai
      shell: bash
      run: |
        if [ -n "${{ inputs.spectra-version }}" ]; then
          pip install --upgrade "spectra-ai==${{ inputs.spectra-version }}"
        else
          pip install --upgrade "spectra-ai"
        fi

    - name: Run Spectra
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set +e
        TARGET="${{ inputs.path }}"

        EXT="${{ inputs.format }}"
        REPORT_PATH="spectra-report.${EXT}"

        QUICK_FLAG=""
        if [ "${{ inputs.quick-mode }}" = "true" ]; then
          QUICK_FLAG="--quick"
        fi

        spectra analyze "${TARGET}" \
          ${QUICK_FLAG} \
          --format "${EXT}" \
          --output "${REPORT_PATH}" \
          --fail-on "${{ inputs.fail-on }}" \
          --min-score "${{ inputs.min-score }}"
        EXIT_CODE=$?
        set -e

        echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
        echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

    - name: Parse grade and score
      id: parse
      shell: bash
      run: |
        REPORT="${{ steps.run.outputs.report_path }}"
        if [ "${{ inputs.format }}" = "json" ] && [ -f "${REPORT}" ]; then
          GRADE=$(python3 -c "import json; r=json.load(open('${REPORT}')); print(r.get('score_card',{}).get('overall_grade','N/A'))")
          SCORE=$(python3 -c "import json; r=json.load(open('${REPORT}')); print(r.get('score_card',{}).get('overall_score','0'))")
        else
          GRADE="N/A"
          SCORE="0"
        fi
        echo "grade=${GRADE}" >> "$GITHUB_OUTPUT"
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"

    # Markdown-safe PR comment renderer (capability #4 — RICE-72).
    # The body is composed by `spectra render pr-comment`, which enforces
    # a finding-field allowlist and HTML-escapes every text field so a
    # malicious finding cannot inject script/img/link payloads into the
    # PR comment surface (Red Team T3).
    - name: Render safe PR comment body
      id: comment_body
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && inputs.format == 'json' }}
      shell: bash
      env:
        REPORT_PATH: ${{ steps.run.outputs.report_path }}
      run: |
        set -euo pipefail
        BODY_FILE="${RUNNER_TEMP:-/tmp}/spectra-pr-comment.md"
        spectra render pr-comment "${REPORT_PATH}" > "${BODY_FILE}"
        # Append a workflow-run footer (links are trusted — they come from
        # GitHub's own environment, not from finding text).
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        printf '\n[Workflow run](%s) · Re-runs on this PR update this comment.\n' "${RUN_URL}" >> "${BODY_FILE}"
        echo "body_file=${BODY_FILE}" >> "$GITHUB_OUTPUT"

    # Pinned to v7.0.1
    - name: Post or update PR comment
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && inputs.format == 'json' }}
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      env:
        BODY_FILE: ${{ steps.comment_body.outputs.body_file }}
      with:
        script: |
          const fs = require('fs');
          const MARKER = '<!-- SPECTRA -->';
          const body = fs.readFileSync(process.env.BODY_FILE, 'utf8');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(MARKER));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    # Upload SARIF to the code-scanning / Security tab. Runs only when the
    # caller asked for SARIF output; needs `security-events: write`. Pinned
    # to codeql-action v3.36.2.
    - name: Upload SARIF to the Security tab
      if: ${{ inputs.format == 'sarif' && hashFiles(steps.run.outputs.report_path) != '' }}
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
      with:
        sarif_file: ${{ steps.run.outputs.report_path }}
        category: spectra

    # Enforce the gate LAST, so the PR comment and SARIF upload still run on a
    # failing scan. `spectra analyze` exits non-zero when --fail-on or
    # --min-score trips; that code is captured in the Run step and re-raised
    # here. Without this step the gates would be decorative.
    - name: Enforce gate
      shell: bash
      run: |
        CODE="${{ steps.run.outputs.exit_code }}"
        if [ "${CODE}" != "0" ]; then
          echo "✗ Spectra gate failed (grade ${{ steps.parse.outputs.grade }}, score ${{ steps.parse.outputs.score }}). See the report above."
          exit "${CODE}"
        fi
        echo "✓ Spectra gate passed (grade ${{ steps.parse.outputs.grade }}, score ${{ steps.parse.outputs.score }})."
