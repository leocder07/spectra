version: 2

# Ecosystem coverage:
# - pip: Covers all Python dependencies in pyproject.toml (runtime + dev)
# - github-actions: Covers CI/CD workflow action versions in .github/workflows/
# Note: No npm/Docker ecosystems needed — Spectra is a pure Python project.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
