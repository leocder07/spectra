# Publish Spectra to PyPI on release tag push
#
# Uses trusted publishing (OIDC) — no API token secrets needed.
# Set up the publisher at:
#   https://pypi.org/manage/project/spectra-cli/settings/publishing/
#
# To trigger: git tag v0.1.0 && git push origin v0.1.0

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build the distribution artifacts
  # ──────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ──────────────────────────────────────────────
  # Job 2: Run tests before publishing
  # ──────────────────────────────────────────────
  test:
    name: Test before publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v --cov=spectra --cov-fail-under=70

  # ──────────────────────────────────────────────
  # Job 3: Publish to PyPI using trusted publishing
  # ──────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: pypi
      url: https://pypi.org/project/spectra-cli/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
