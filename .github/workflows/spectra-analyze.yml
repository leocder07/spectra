# Reusable Spectra Analysis Workflow
#
# Copy this file into YOUR repo at .github/workflows/spectra-analyze.yml
# to analyze your codebase with Spectra on every pull request.
#
# Prerequisites:
#   1. Add your Anthropic API key as a repository secret:
#      Settings > Secrets > Actions > ANTHROPIC_API_KEY
#   2. That's it.
#
# Usage:
#   This workflow triggers on PRs. It installs Spectra from PyPI,
#   runs a quick analysis, uploads the HTML report as an artifact,
#   and posts a summary comment on the PR.
#
# Customization:
#   - Remove --quick to enable the CritiqueAgent (deeper analysis, ~90s)
#   - Change --format to "json" for machine-readable output
#   - Adjust spectra-version to pin a specific release
#   - Set fail-on-grade to block PRs below a threshold

name: Spectra Analysis

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

env:
  SPECTRA_VERSION: "spectra-cli"  # Pin with spectra-cli==0.1.0 if needed

jobs:
  analyze:
    name: Spectra Code Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # Analysis is advisory by default

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Spectra
        run: pip install "${{ env.SPECTRA_VERSION }}"

      - name: Run Spectra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        id: spectra
        run: |
          set +e
          spectra analyze . --quick --format json --output spectra-report.json
          SPECTRA_EXIT=$?
          set -e

          # Also generate the HTML report for download
          if [ -f spectra-report.json ]; then
            spectra analyze . --quick --output spectra-report.html || true
          fi

          echo "exit_code=$SPECTRA_EXIT" >> "$GITHUB_OUTPUT"

      # ── Optional: Fail PR if grade is below threshold ──
      # Uncomment the following step to enforce a minimum grade.
      #
      # - name: Check grade threshold
      #   if: steps.spectra.outputs.exit_code == '0'
      #   run: |
      #     SCORE=$(python3 -c "
      #     import json, sys
      #     r = json.load(open('spectra-report.json'))
      #     print(r.get('overall_score', r.get('score', 0)))
      #     ")
      #     echo "Score: $SCORE"
      #     if [ "$SCORE" -lt 60 ]; then
      #       echo "::error::Spectra score $SCORE is below the minimum threshold of 60"
      #       exit 1
      #     fi

      - name: Upload Spectra report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-report
          path: |
            spectra-report.json
            spectra-report.html
          retention-days: 30

      - name: Post PR summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Spectra Analysis\n\n';

            try {
              const raw = fs.readFileSync('spectra-report.json', 'utf8');
              const report = JSON.parse(raw);

              const grade = report.overall_grade || report.grade || 'N/A';
              const score = report.overall_score || report.score || 'N/A';
              const findings = report.findings ? report.findings.length : 0;
              const critical = report.findings
                ? report.findings.filter(f => f.severity === 'critical').length
                : 0;

              body += `| Metric | Value |\n`;
              body += `|--------|-------|\n`;
              body += `| Overall Grade | **${grade}** (${score}/100) |\n`;
              body += `| Total Findings | ${findings} |\n`;
              body += `| Critical | ${critical} |\n\n`;

              if (report.dimensions) {
                body += `### Dimension Scores\n\n`;
                body += `| Dimension | Score | Grade |\n`;
                body += `|-----------|-------|-------|\n`;
                for (const dim of report.dimensions) {
                  const name = dim.name || dim.dimension;
                  body += `| ${name} | ${dim.score}/100 | ${dim.grade} |\n`;
                }
                body += '\n';
              }

              if (report.findings && report.findings.length > 0) {
                const top = report.findings
                  .filter(f => f.severity === 'critical' || f.severity === 'high')
                  .slice(0, 5);
                if (top.length > 0) {
                  body += `### Top Findings\n\n`;
                  for (const f of top) {
                    body += `- **[${f.severity.toUpperCase()}]** ${f.title || f.message}`;
                    if (f.file_path) body += ` (\`${f.file_path}\`)`;
                    body += '\n';
                  }
                  body += '\n';
                }
              }

              body += `> Full report available in the [build artifacts](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).\n`;
            } catch (err) {
              body += `Analysis did not produce a parseable report.\n\n`;
              body += `Check the [workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.\n`;
            }

            body += `\n---\n*Generated by [Spectra](https://github.com/leocder07/spectra) — 8 AI agents, 6 dimensions, under 5 minutes*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Spectra Analysis';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
