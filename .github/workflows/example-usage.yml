# Example: how a downstream consumer uses the Spectra Action.
#
# Copy this file into your repo at .github/workflows/spectra.yml,
# then add ANTHROPIC_API_KEY under Settings > Secrets > Actions.
#
# Pin `spectra-ai/spectra@v1` to a commit SHA for stricter supply-chain
# guarantees once you've validated a release.

name: Spectra (example)

on:
  pull_request:
    branches: [main]

# The Action needs to read code and write a PR comment.
# Grant only what's needed.
permissions:
  contents: read
  pull-requests: write

jobs:
  spectra:
    name: Spectra analysis
    runs-on: ubuntu-latest
    steps:
      # Pinned to v4.2.2 — replace with the SHA of the release you trust.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Spectra
        id: spectra
        uses: spectra-ai/spectra@v1
        with:
          # REQUIRED — store this in repo secrets, never inline a key.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional — defaults to "." (the checked-out workspace).
          # Pass a different path or an https URL to analyze something else.
          path: "."

          # Optional — "json" (default, recommended for CI) or "html".
          format: json

          # Optional — set "true" to skip the CritiqueAgent stage and
          # finish in ~60s instead of ~3min. Use for fast feedback PRs.
          quick-mode: "false"

          # Optional — set "false" to suppress the auto PR comment
          # (e.g. if you want to render findings yourself downstream).
          comment-on-pr: "true"

      # Demonstrates consuming the Action's outputs in later steps.
      - name: Print summary
        run: |
          echo "Grade: ${{ steps.spectra.outputs.grade }}"
          echo "Score: ${{ steps.spectra.outputs.score }}"
          echo "Report: ${{ steps.spectra.outputs.findings-json }}"
