# Spectra CI — Test, Lint, and Self-Analysis
#
# This workflow serves two purposes:
#   1. Standard CI: lint + test on every push and PR
#   2. Integration demo: Spectra analyzes itself on PRs
#
# Other repos can copy the "spectra-analysis" job or use the
# reusable workflow at .github/workflows/spectra-analyze.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test & Lint (runs on every push and PR)
  # ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint — ruff check
        run: ruff check src/ tests/

      - name: Lint — ruff format
        run: ruff format --check src/ tests/

      - name: Test with coverage
        run: |
          pytest tests/ -v \
            --cov=spectra \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ──────────────────────────────────────────────
  # Job 2: Spectra Self-Analysis (PRs only)
  #
  # This demonstrates how any repo can integrate
  # Spectra into its CI/CD pipeline. Spectra
  # analyzes itself and posts results on the PR.
  # ──────────────────────────────────────────────
  spectra-analysis:
    name: Spectra Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    continue-on-error: true  # Analysis is advisory, not blocking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Spectra
        run: pip install -e .

      - name: Run Spectra analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          spectra analyze . --quick --format json --output spectra-report.json
          spectra analyze . --quick --output spectra-report.html

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-report
          path: |
            spectra-report.json
            spectra-report.html
          retention-days: 30

      - name: Post PR comment with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Spectra Analysis\n\n';

            try {
              const raw = fs.readFileSync('spectra-report.json', 'utf8');
              const report = JSON.parse(raw);

              const grade = report.overall_grade || report.grade || 'N/A';
              const score = report.overall_score || report.score || 'N/A';
              const findings = report.findings ? report.findings.length : 0;
              const critical = report.findings
                ? report.findings.filter(f => f.severity === 'critical').length
                : 0;

              body += `| Metric | Value |\n`;
              body += `|--------|-------|\n`;
              body += `| Overall Grade | **${grade}** (${score}/100) |\n`;
              body += `| Total Findings | ${findings} |\n`;
              body += `| Critical | ${critical} |\n\n`;

              // Dimension scores
              if (report.dimensions) {
                body += `### Dimension Scores\n\n`;
                body += `| Dimension | Score | Grade |\n`;
                body += `|-----------|-------|-------|\n`;
                for (const dim of report.dimensions) {
                  const name = dim.name || dim.dimension;
                  body += `| ${name} | ${dim.score}/100 | ${dim.grade} |\n`;
                }
                body += '\n';
              }

              // Top critical/high findings
              if (report.findings && report.findings.length > 0) {
                const top = report.findings
                  .filter(f => f.severity === 'critical' || f.severity === 'high')
                  .slice(0, 5);
                if (top.length > 0) {
                  body += `### Top Findings\n\n`;
                  for (const f of top) {
                    body += `- **[${f.severity.toUpperCase()}]** ${f.title || f.message}`;
                    if (f.file_path) body += ` (\`${f.file_path}\`)`;
                    body += '\n';
                  }
                  body += '\n';
                }
              }

              body += `> Full report available as a build artifact.\n`;
            } catch (err) {
              body += `Analysis did not produce a parseable report.\n\n`;
              body += `Check the workflow logs for details.\n`;
            }

            body += `\n---\n*Generated by [Spectra](https://github.com/leocder07/spectra) — 8 AI agents, 6 dimensions, under 5 minutes*`;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Spectra Analysis';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
