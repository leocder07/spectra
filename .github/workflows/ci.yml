# Spectra CI — Test, Lint, and Self-Analysis
#
# This workflow serves two purposes:
#   1. Standard CI: lint + test on every push and PR
#   2. Integration demo: Spectra analyzes itself on PRs
#
# Other repos can copy the "spectra-analysis" job or use the
# reusable workflow at .github/workflows/spectra-analyze.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test & Lint (runs on every push and PR)
  # ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (libsqlcipher for cache encryption)
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        # ``[encryption]`` opt-in extra installs pysqlcipher3 so the
        # encryption test path still runs in CI (the apt step above
        # provides the libsqlcipher headers it source-builds against).
        # End users get plain SQLite + HMAC by default — see pyproject.toml.
        run: pip install -e ".[dev,encryption]"

      - name: Lint — ruff check
        run: ruff check src/ tests/

      - name: Lint — ruff format
        run: ruff format --check src/ tests/

      - name: Test with coverage
        run: |
          pytest tests/ -v \
            --cov=spectra \
            --cov-report=term-missing \
            --cov-fail-under=70

